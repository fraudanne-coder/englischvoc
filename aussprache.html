<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>Vokabel-Aussprache-Trainer</title>
</head>
<body>

    <h1>Mein Vokabel-Trainer</h1>

    <!-- Beispiel 1: Einzelnes Wort ohne Leerzeichen -->
    <div class="vocab-item">
      <span>yellow</span>
      <button onclick="playVocabAudio('yellow')">🔊 Anhören</button>
    </div>

    <!-- Beispiel 2: Phrase mit Leerzeichen -->
    <div class="vocab-item">
      <span>railway station</span>
      <button onclick="playVocabAudio('railway station')">🔊 Anhören</button>
    </div>

    <!-- Die universelle Abspielfunktion -->
    <script>
    function playVocabAudio(word) {
        // Wandelt Leerzeichen automatisch in Unterstriche um (z.B. "railway station" -> "railway_station.mp3")
        let filename = word.trim().toLowerCase().replace(/\s+/g, '_') + '.mp3';
        
        let audio = new Audio(filename);
        audio.play().catch(err => {
            console.error("Audiodatei nicht gefunden: " + filename);
        });
    }
    </script>

</body>
    </html>
