<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vokabel-Aussprache-Trainer</title>
    <!-- PapaParse zum einfachen Einlesen von CSV-Dateien im Browser -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #f4f6f9;
            color: #333;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }
        .trainer-card {
            background: white;
            padding: 2.5rem;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
            text-align: center;
            width: 340px;
        }
        .batch-select {
            margin-bottom: 1.5rem;
        }
        .batch-select select {
            padding: 0.5rem;
            border-radius: 6px;
            border: 1px solid #ccc;
            font-size: 1rem;
            width: 100%;
            box-sizing: border-box;
        }
        .vocab-display {
            min-height: 110px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            margin-bottom: 1.5rem;
        }
        .english-word {
            font-size: 1.8rem;
            font-weight: bold;
            color: #1d3557;
            margin-bottom: 0.4rem;
        }
        .german-translation {
            font-size: 1.1rem;
            color: #6c757d;
        }
        .audio-btn {
            background-color: #457b9d;
            color: white;
            border: none;
            padding: 0.6rem 1.2rem;
            border-radius: 6px;
            font-size: 1rem;
            cursor: pointer;
            margin-bottom: 1.5rem;
            width: 100%;
            transition: background 0.2s;
        }
        .audio-btn:hover {
            background-color: #1d3557;
        }
        .nav-buttons {
            display: flex;
            gap: 10px;
            justify-content: center;
        }
        .nav-btn {
            flex: 1;
            padding: 0.6rem;
            border: none;
            border-radius: 6px;
            font-size: 0.95rem;
            cursor: pointer;
            font-weight: 500;
        }
        .btn-repeat {
            background-color: #e9ecef;
            color: #495057;
        }
        .btn-repeat:hover {
            background-color: #dde2e6;
        }
        .btn-next {
            background-color: #2a9d8f;
            color: white;
        }
        .btn-next:hover {
            background-color: #21867a;
        }
    </style>
</head>
<body>

    <div class="trainer-card">
        <!-- Batch / Kategorie Auswahl -->
        <div class="batch-select">
            <label for="batchSelect"><strong>Batch wählen:</strong></label><br><br>
            <select id="batchSelect" onchange="changeBatch()">
                <option value="alle">Alle Vokabeln</option>
            </select>
        </div>

        <!-- Vokabel Anzeige -->
        <div class="vocab-display">
            <div id="englishWord" class="english-word">Lade CSV...</div>
            <div id="germanWord" class="german-translation">Bitte warten</div>
        </div>

        <!-- Aussprache / Wiederholen Button -->
        <button class="audio-btn" onclick="playCurrentAudio()">🔊 Anhören</button>

        <!-- Navigation -->
        <div class="nav-buttons">
            <button class="nav-btn btn-repeat" onclick="repeatWord()">Wiederholen</button>
            <button class="nav-btn btn-next" onclick="nextWord()">Weiter ➔</button>
        </div>
    </div>

    <script>
        let allVocabs = [];
        let filteredVocabs = [];
        let currentIndex = 0;

        // CSV beim Laden der Seite einlesen
        window.onload = function() {
            Papa.parse("vokabeln.csv", {
                download: true,
                header: true,
                skipEmptyLines: true,
                complete: function(results) {
                    allVocabs = results.data;
                    setupBatches();
                    filterVocabs();
                },
                error: function(err) {
                    document.getElementById("englishWord").textContent = "Fehler";
                    document.getElementById("germanWord").textContent = "vokabeln.csv nicht gefunden";
                    console.error("CSV Ladefehler:", err);
                }
            });
        };

        // Dynamisches Befüllen des Dropdowns aus der CSV (sucht nach Spalte 'batch' oder 'unit')
        function setupBatches() {
            const batchSelect = document.getElementById("batchSelect");
            const batches = new Set();

            allVocabs.forEach(row => {
                // Prüft ob eine Spalte 'batch' oder 'unit' existiert
                let batchVal = row.batch || row.unit;
                if (batchVal) {
                    batches.add(batchVal.trim());
                }
            });

            // Falls Batches gefunden wurden, Dropdown erweitern
            batches.forEach(batch => {
                let option = document.createElement("option");
                option.value = batch;
                option.textContent = batch;
                batchSelect.appendChild(option);
            });
        }

        // Vokabeln basierend auf der Auswahl filtern
        function changeBatch() {
            currentIndex = 0;
            filterVocabs();
        }

        function filterVocabs() {
            const selectedBatch = document.getElementById("batchSelect").value;

            if (selectedBatch === "alle") {
                filteredVocabs = [...allVocabs];
            } else {
                filteredVocabs = allVocabs.filter(row => (row.batch && row.batch.trim() === selectedBatch) || (row.unit && row.unit.trim() === selectedBatch));
            }

            updateCard();
        }

        function updateCard() {
            if (filteredVocabs.length === 0) {
                document.getElementById("englishWord").textContent = "Keine Daten";
                document.getElementById("germanWord").textContent = "";
                return;
            }

            const current = filteredVocabs[currentIndex];
            // Unterstützt sowohl 'en' / 'de' als auch 'englisch' / 'deutsch' als Spaltennamen
            const enText = current.en || current.englisch || "";
            const deText = current.de || current.deutsch || "";

            document.getElementById("englishWord").textContent = enText;
            document.getElementById("germanWord").textContent = deText;
            
            if (enText) {
                playCurrentAudio();
            }
        }

        function playCurrentAudio() {
            if (filteredVocabs.length === 0) return;
            const current = filteredVocabs[currentIndex];
            const word = current.en || current.englisch || "";
            
            if (!word) return;

            // Wandelt Leerzeichen automatisch in Unterstriche um (z.B. "railway station" -> "railway_station.mp3")
            let filename = word.trim().toLowerCase().replace(/\s+/g, '_') + '.mp3';
            
            let audio = new Audio(filename);
            audio.play().catch(err => {
                console.error("Audiodatei nicht gefunden: " + filename);
            });
        }

        function repeatWord() {
            playCurrentAudio();
        }

        function nextWord() {
            if (filteredVocabs.length === 0) return;
            currentIndex = (currentIndex + 1) % filteredVocabs.length;
            updateCard();
        }
    </script>

</body>
</html>
